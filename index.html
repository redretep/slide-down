<!DOCTYPE html>
<html>
<head>
<style>
body{
margin:0;
overflow:hidden;
}

iframe{
width:100vw;
height:100vh;
border:0;
}

#fsbtn{
position:fixed;
bottom:20px;
right:20px;
padding:12px 16px;
background:black;
color:white;
opacity:0.2;
border-radius:14px;
cursor:pointer;
user-select:none;
}
</style>
</head>
<body>

<iframe id="game" src="https://gamea.azgame.io/slide-down/"></iframe>

<div id="fsbtn">fullscreen</div>

<script>
const btn = document.getElementById("fsbtn")
const game = document.getElementById("game")

btn.onclick = function(){
if(game.requestFullscreen){
game.requestFullscreen()
}
}

let dragging = false
let offsetX = 0
let offsetY = 0

btn.addEventListener("mousedown", function(e){
dragging = true
offsetX = e.clientX - btn.offsetLeft
offsetY = e.clientY - btn.offsetTop
})

document.addEventListener("mousemove", function(e){
if(!dragging) return
btn.style.left = (e.clientX - offsetX) + "px"
btn.style.top = (e.clientY - offsetY) + "px"
btn.style.right = "auto"
btn.style.bottom = "auto"
})

document.addEventListener("mouseup", function(){
dragging = false
})
</script>

</body>
</html><iframe id="game" src="https://gamea.azgame.io/slide-down/" style="width:100vw; height:100vh; border:0;"></iframe>
