<!DOCTYPE html>
<html lang="en-us">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Slide Down</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
		#unity-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
		#unity-canvas { width: 100%; height: 100%; background: #231F20; display: block; }
		#loadingBlock {
			position: absolute; top: 0; left: 0; width: 100%; height: 100%;
			display: flex; flex-direction: column; align-items: center; justify-content: center;
			background: #1e1e24; color: #fff; z-index: 10;
		}
		.gameloader-game-name { font-size: 28px; font-weight: bold; margin-bottom: 20px; }
		.gameloader-progressbar {
			width: 280px; height: 16px; background: #333; border-radius: 8px;
			overflow: hidden; border: 1px solid #555; margin-bottom: 10px;
		}
		.gameloader-progressbar-progress { width: 0%; height: 100%; background: #00bcd4; transition: width 0.2s; }
		.gameloader-progress-info { font-size: 14px; color: #aaa; text-align: center; }
	</style>
	<script>
		var versionFolder = "26010801/";
		var buildUrl = "./" + versionFolder + "Build";
		var loaderUrl = buildUrl + "/slide-down-v26010801.loader.js";
		var config = {
			dataUrl: buildUrl + "/slide-down-v26010801.data.unityweb",
			frameworkUrl: buildUrl + "/slide-down-v26010801.framework.js",
			codeUrl: buildUrl + "/slide-down-v26010801.wasm.unityweb",
			streamingAssetsUrl: versionFolder + "StreamingAssets",
			companyName: "Marty Games",
			productName: "Slide Down",
			productVersion: "26010801"
		};
	</script>
</head>
<body>

<div id="unity-container" style="display: none;">
	<canvas id="unity-canvas"></canvas> 
</div>

<div id="loadingBlock">
	<div class="gameloader-game-name">Slide Down</div>
	<div class="gameloader-progressbar">
		<div class="gameloader-progressbar-progress" id="progress_fill"></div>
	</div>
	<div class="gameloader-progress-info" id="progress_text">Connecting...</div>
</div>

<script>
	var progressElement = document.getElementById('progress_fill');
	var progressText = document.getElementById('progress_text');
	var container = document.getElementById("unity-container");
	var canvas = document.getElementById("unity-canvas");
	var loadingBar = document.getElementById("loadingBlock");

	var script = document.createElement("script");
	script.src = loaderUrl;
	
	script.onerror = function() {
		progressText.innerText = "Error: Failed to load " + loaderUrl + ". Check file paths in Console (F12).";
	};

	script.onload = () => {
		createUnityInstance(canvas, config, (progress) => {
			var percent = Math.round(progress * 100);
			progressElement.style.width = percent + "%";
			progressText.innerText = "Loading game... " + percent + "%";
		}).then((unityInstance) => {
			window.unityInstance = unityInstance;
			loadingBar.style.display = "none";
			container.style.display = "block";
		}).catch((message) => {
			progressText.innerText = "Unity Error: " + message;
			console.error(message);
		});
	};
	document.body.appendChild(script);
</script>
</body>
</html>
