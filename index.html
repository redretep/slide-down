<!DOCTYPE html>
<html lang="en-us">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<link rel="stylesheet" href="26010801/theme/game.css">
	<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500&display=swap" rel="stylesheet">
	<title>Slide Down</title>
	<meta name="description" content=""/>
	<style type="text/css">
		.jss1:before {
			top: 0;
			width: 100%;
			filter: blur(16px);
			height: 100%;
			content: "";
			display: block;
			opacity: .5;
			z-index: 0;
			position: absolute;
			background-size: cover;
			background-image: url("26010801/loading.png")
		}
	</style> 
	 
	<script>
		var buildUrl = "Build";
		var versionFolder = "26010801/";
		buildUrl = "./" + versionFolder + buildUrl;
		var loaderUrl = buildUrl + "/slide-down-v26010801.loader.js";
		var config = {
			dataUrl: buildUrl + "/slide-down-v26010801.data.unityweb",
			frameworkUrl: buildUrl + "/slide-down-v26010801.framework.js",
			codeUrl: buildUrl + "/slide-down-v26010801.wasm.unityweb",
			streamingAssetsUrl: versionFolder + "StreamingAssets",
			companyName: "Marty Games",
			productName: "Slide Down",
			productVersion: "26010801"
		};
		config.gameId = "slide-down";
		config.eventLog = false;
	</script>
</head>

<body>
<div id="unity-container" style="display: none;">
	<canvas id="unity-canvas"></canvas> 
</div>
<div id="loadingBlock">
	<div class="jss31 jss34 jss1">
		<div style="position: absolute; font-family: Arial, Helvetica, sans-serif; bottom: 10px; right: 10px; font-size: 18px; color: #ffffff; opacity: 0.5;">26010801</div>
		<div class="spinner"></div>
		<div class="jss31 jss34 jss48" style="flex: 1 1 0%;">
			<div class="jss32">
				<div class="jss7 jss9 jss20 jss3">
					<div class="jss125">
						<div class="jss123">
							<img src="26010801/logo.png" alt="Logo">
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="jss31 jss34" style="flex: 3 1 0%;">
			<div class="jss32">
				<div class="jss31 jss34 jss39 jss50 gameloader">
					<div class="jss32">
						<div class="gameloader-game-name">Slide Down</div>
					</div>
					<div class="jss32">
						<div class="jss32 gameloader-logo">
							<img id="game-logo" src="26010801/loading.png" alt="Loading">
						</div>
					</div>
					<div class="jss32">
						<div>
							<div class="gameloader-progressbar">
								<div class="gameloader-progressbar-progress" id="progress_fill" style="width: 0%;"></div>
							</div>
							<div class="gameloader-progress-info">Game Loading...</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<script> 
	var progressElement = document.getElementById('progress_fill');
	var container = document.getElementById("unity-container");
	var canvas = document.getElementById("unity-canvas");
	var loadingBar = document.querySelector("#loadingBlock");
	var progress_text = document.querySelector(".gameloader-progress-info");
	var script = document.createElement("script");

	script.src = loaderUrl;
	script.onload = () => {
		createUnityInstance(canvas, config, (progress) => {
			progressElement.style.width = 100 * progress + "%";
			progress_text.innerText = "Downloading file: " + Math.round(progress * 100) + "%";
			if (progress >= 0.99) {
				progress_text.innerText = "Game Loading ...";
			}
		}).then((unityInstance) => {
			window.unityInstance = unityInstance;
			setTimeout(function() {
				loadingBar.style.display = "none";
				window.focus();
			}, 2000);
			container.style.display = "block";
		}).catch((message) => {
			alert(message);
		});
	};
	document.body.appendChild(script);
</script>
</body>	
</html>
